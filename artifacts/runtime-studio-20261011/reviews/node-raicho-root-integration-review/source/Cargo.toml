[workspace]
members = ["crates/engine_core", "crates/game_core", "crates/game_web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.30.9", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
hecs = "0.11.2"
bytemuck = { version = "1.24.0", features = ["derive"] }

[profile.release]
lto = "thin"
opt-level = 3

