name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Native DSP comparison verifies its exact historical Git source.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Install locked shell dependencies
        run: |
          npm install --global pnpm@11.3.0
          pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Native simulation and UI
        run: cargo test --workspace --locked
      - name: Native warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Shell, storage and production service
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Install pinned offline asset tooling
        run: python -m pip install -r scripts/asset-requirements.txt
      - name: Exact cell conversions, topology and loss policies
        run: python scripts/asset-pack-tests.py -v
      - name: KIKAI portraits, current guide canon and authored controls
        run: python scripts/asset-kikai-tests.py
      - name: Distinct licensed DORO and TALO cell packs
        run: python scripts/asset-kikai-profiles-tests.py
      - name: Detailed KIKAI portraits and exact committed cell packs
        run: python scripts/asset-kikai-detail-tests.py
      - name: Detailed native flight controls and reproducible masks
        run: python scripts/asset-flight-icons-tests.py
      - name: Detailed shooting-star palette and occupied cells
        run: python scripts/asset-shooting-star-tests.py
      - name: Actual native PixelBody, group and animation extraction
        run: cargo test --locked --manifest-path scripts/asset-native-preview/Cargo.toml
      - name: Extract and audit the accepted dock conversion
        run: |
          cargo run --locked --manifest-path scripts/asset-native-preview/Cargo.toml -- assets/pipeline/haven-service/pack.json service-pulse work/ci-asset-native.json
          python scripts/asset-audit.py --pack assets/pipeline/haven-service/pack.json --extraction work/ci-asset-native.json --output work/ci-asset-audit.json
      - name: Retain actual native conversion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-proof-${{ matrix.os }}-${{ github.sha }}
          path: |
            work/ci-asset-native.json
            work/ci-asset-audit.json
          if-no-files-found: error
          retention-days: 14

  browser-package:
    name: Browser package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Install locked shell dependencies
        run: |
          npm install --global pnpm@11.3.0
          pnpm install --frozen-lockfile
      - name: Build both renderer packages and game-only PWA
        run: pnpm build
      - name: Actual Rust WASM snapshots through SaveStore with headless fake-indexeddb
        run: pnpm test:wasm-contract
      - name: WASM warnings
        run: |
          cargo clippy -p game_web --locked --target wasm32-unknown-unknown --no-default-features --features webgpu -- -D warnings
          cargo clippy -p game_web --locked --target wasm32-unknown-unknown --no-default-features --features webgl -- -D warnings
      - name: Retain candidate game package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
